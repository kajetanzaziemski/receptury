<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    body { font-family: Arial, sans-serif; font-size: 13px; margin: 0; padding: 12px; }
    h3 { margin: 0 0 8px; font-size: 15px; }
    h4 { margin: 12px 0 4px; font-size: 13px; }
    label.r { display: block; padding: 2px 0; }
    input[type=text] { width: 100%; box-sizing: border-box; padding: 6px; margin-bottom: 6px; }
    select { width: 100%; box-sizing: border-box; }
    .row { margin: 10px 0; }
    button { padding: 6px 10px; cursor: pointer; }
    button.primary { background: #1a73e8; color: #fff; border: 0; border-radius: 3px; }
    button:disabled { opacity: .5; cursor: default; }
    #msg { margin-top: 8px; white-space: pre-wrap; }
    #msg.err { color: #b00020; }
    #msg.ok { color: #137333; }
    #warn { margin-top: 8px; white-space: pre-wrap; background: #fff4ce; border: 1px solid #e0b100; padding: 6px; display: none; }
  </style>
</head>
<body>
  <h3>Receptury</h3>

  <h4>1. Wybierz identyfikator</h4>
  <div id="ids"></div>

  <h4>2. Wybierz wartość</h4>
  <input type="text" id="filter" placeholder="Szukaj…" oninput="renderValues()">
  <select id="values" size="12"></select>

  <div class="row"><button class="primary" id="load" onclick="load()">Wczytaj</button></div>
  <div id="warn"></div>
  <div id="msg"></div>

  <script>
    let column = '';
    let values = [];
    const $ = id => document.getElementById(id);

    function msg(text, cls) { const m = $('msg'); m.textContent = text || ''; m.className = cls || ''; }
    function warn(text) { const w = $('warn'); w.textContent = text || ''; w.style.display = text ? 'block' : 'none'; }

    function init() {
      google.script.run.withSuccessHandler(cols => {
        const box = $('ids');
        cols.forEach((c, i) => {
          const l = document.createElement('label');
          l.className = 'r';
          const r = document.createElement('input');
          r.type = 'radio'; r.name = 'col'; r.value = c; r.checked = i === 0;
          r.onchange = () => pick(c);
          l.append(r, ' ' + c);
          box.appendChild(l);
        });
        pick(cols[0]);
      }).withFailureHandler(e => msg(e.message, 'err')).getIdColumns();
    }

    function pick(c) {
      column = c;
      values = [];
      $('filter').value = '';
      renderValues();
      msg('Wczytywanie…');
      warn('');
      google.script.run.withSuccessHandler(res => {
        if (res.error) { msg(res.error, 'err'); return; }
        if (c !== column) return;       // a later pick won the race
        msg('');
        values = res.values;
        renderValues();
      }).withFailureHandler(e => msg(e.message, 'err')).getUniqueValues(c);
    }

    function renderValues() {
      const q = $('filter').value.trim().toLowerCase();
      const sel = $('values');
      const prev = sel.value;
      sel.textContent = '';
      values.filter(v => !q || v.toLowerCase().indexOf(q) >= 0).forEach(v => {
        const o = document.createElement('option');
        o.value = v; o.textContent = v;
        if (v === prev) o.selected = true;
        sel.appendChild(o);
      });
    }

    function load() {
      const v = $('values').value;
      if (!v) { msg('Wybierz wartość z listy.', 'err'); return; }
      $('load').disabled = true;
      msg('Wczytywanie…');
      warn('');
      google.script.run.withSuccessHandler(res => {
        $('load').disabled = false;
        if (res.error) { msg(res.error, 'err'); return; }
        let t = 'Wczytano ' + res.written + ' komponentów.';
        if (res.added.length) t += '\nDodano na końcu (brak w kolumnie B): ' + res.added.join(', ');
        msg(t, 'ok');
        warn(res.warning);
      }).withFailureHandler(e => { $('load').disabled = false; msg(e.message, 'err'); })
        .loadRecipe(column, v);
    }

    init();
  </script>
</body>
</html>
