<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    body { font-family: Arial, sans-serif; font-size: 13px; margin: 0; padding: 12px; }
    h3 { margin: 0 0 8px; font-size: 15px; }
    label { display: block; margin-bottom: 4px; }
    input[type=text] { width: 100%; box-sizing: border-box; padding: 6px; margin-bottom: 6px; }
    select { width: 100%; box-sizing: border-box; padding: 6px; }
    .row { margin: 10px 0; }
    button { padding: 6px 10px; cursor: pointer; }
    button.primary { background: #1a73e8; color: #fff; border: 0; border-radius: 3px; }
    button:disabled { opacity: .5; cursor: default; }
    #msg { margin-top: 8px; white-space: pre-wrap; }
    #msg.err { color: #b00020; }
    #msg.ok { color: #137333; }
    #warn { margin-top: 8px; white-space: pre-wrap; background: #fff4ce; border: 1px solid #e0b100; padding: 6px; display: none; }
  </style>
</head>
<body>
  <h3>Receptury</h3>

  <label for="filter">Produkt (Receptura / Asortyment)</label>
  <input type="text" id="filter" placeholder="Szukaj…" oninput="render()">
  <select id="entry"></select>

  <div class="row">
    <button class="primary" id="load" onclick="load()">Wczytaj</button>
    <button onclick="refresh()">Odśwież listę</button>
  </div>
  <div id="warn"></div>
  <div id="msg"></div>

  <script>
    const $ = id => document.getElementById(id);
    let entries = [];

    function msg(text, cls) { const m = $('msg'); m.textContent = text || ''; m.className = cls || ''; }
    function warn(text) { const w = $('warn'); w.textContent = text || ''; w.style.display = text ? 'block' : 'none'; }

    function render() {
      const sel = $('entry');
      const prev = sel.value;
      const q = $('filter').value.trim().toLowerCase();
      sel.textContent = '';
      const first = document.createElement('option');
      first.value = ''; first.textContent = '– wybierz –';
      sel.appendChild(first);
      entries.filter(e => !q || e.label.toLowerCase().indexOf(q) >= 0).forEach(e => {
        const o = document.createElement('option');
        o.value = e.row; o.textContent = e.label;
        if (String(e.row) === prev) o.selected = true;
        sel.appendChild(o);
      });
      if (q && !sel.value && sel.options.length > 1) sel.selectedIndex = 1;   // searching: preselect the first hit
    }

    function refresh() {
      msg(''); warn('');
      google.script.run.withSuccessHandler(res => {
        entries = res.entries;
        render();
        if (res.error) msg(res.error, 'err');
      }).withFailureHandler(e => msg(e.message, 'err')).getEntries();
    }

    function load() {
      const row = Number($('entry').value);
      if (!row) { msg('Wybierz pozycję z listy.', 'err'); return; }
      $('load').disabled = true;
      msg('Wczytywanie…'); warn('');
      google.script.run.withSuccessHandler(res => {
        $('load').disabled = false;
        if (res.error) { msg(res.error, 'err'); return; }
        let t = 'Wczytano ' + res.written + ' komponentów (wartości × ' + res.mass + ').';
        if (res.added.length) t += '\nDodano na końcu (brak w kolumnie B): ' + res.added.join(', ');
        msg(t, 'ok');
        warn(res.warning);
      }).withFailureHandler(e => { $('load').disabled = false; msg(e.message, 'err'); })
        .loadRecipe(row);
    }

    refresh();
  </script>
</body>
</html>
